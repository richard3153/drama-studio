# 模型注册表：显存预算与档位（低显存优先，调度器据此自动选档）
# vram_gb = 预估峰值占用（含文本编码器/VAE/激活），tier: low/mid/high
# role: portrait/image_edit/scene/grid9/video/tts/bgm/upscale/asr/vlm

models:
  # —— 图像（定妆照/场景/道具）——
  img_animaginexl:
    role: [portrait, scene, prop, grid9]
    family: sdxl
    weight: "animagine-xl-3.1.safetensors"
    vram_gb: 6.5        # 实测 6.46GB fp16 / 真 SDXL（双 TE），8G 卡靠 comfy_aimdo 分页
    tier: low
    styles: [anime, paint, 3d]      # 动漫族/3D 族统一走真 SDXL 底模
  img_anythingxl:
    role: [portrait, scene, prop, grid9]
    family: sdxl        # 注意：名为 XL，实测只有 1.99GB / 1133 keys / 单 SD1.5 CLIP，实为 SD1.5 底模
    weight: "AnythingXL_v50.safetensors"
    vram_gb: 4.0
    tier: low
    styles: []          # 已退出自动选档（被 img_animaginexl 取代），保留文件作显存兜底
    ref_image: false    # 实为 SD1.5：不能进「参考生图」（首帧 IPAdapter 绑死 SDXL plus 权重）
  img_realvisxl:
    role: [portrait, scene, prop]
    family: sdxl
    weight: "RealVisXL_V5.0_fp16.safetensors"
    vram_gb: 6.5
    tier: low
    styles: [photo]
  img_qwen_image:
    role: [portrait, scene, prop, image_edit]
    family: qwen_image
    weight: "qwen-image-2512-Q5_K_M.gguf"
    vram_gb: 13.5    # 实测账：Q5 gguf 14GB，8G 显存装不下（原标 7.0 低估，会导致 fits 误选）
    tier: high
    offload: true
    styles: [photo, anime, 3d, paint]
  img_flux2klein4b:
    role: [portrait, scene, prop]
    family: flux2_klein
    weight: "flux-2-klein-4b-fp8.safetensors"
    vram_gb: 6.5
    tier: mid
    offload: true
    styles: [photo, 3d]

  # —— 视频（双链路）——
  vid_h3_int8:
    role: [video]
    label: "MiniMax H3 INT8（20G 底模·最慢·长采样易崩）"
    family: minimax_h3
    weight: "minimax_h3_fl2va_pruned_int8_convrot.safetensors (diffusion_models) + qwen3vl_32b nvfp4_awq 文本编码器"
    workflow: video_h3_i2v.json
    vram_gb: 20.0      # 实测 staged 19995MB（底模）+ 14956MB(TE) + 4965MB(VAE)，8G 全靠分页
    tier: high
  vid_h3_turbo:
    role: [video]
    label: "MiniMax H3 Turbo（20G·热态 2-4 分钟/条）"
    family: minimax_h3
    weight: "同 vid_h3_int8 底模（缓存复用）+ fl2v_turbo_8step_v1.0 LoRA（官方配 4 步）"
    workflow: video_h3_turbo.json
    vram_gb: 20.0      # 同一份底模；4 步采样换页窗口短，8G 上比 int8 稳（#355 通 / #359 崩）
    tier: high
  vid_wan21_480p:
    role: [video]
    label: "WAN2.1 480P（默认·实测 108s/条）"
    family: wan22
    weight: "Wan2_1-I2V-14B-480P_fp8_e4m3fn.safetensors + lightx2v 4step LoRA"
    workflow: i2v_wan21_480p.json
    vram_gb: 7.0
    tier: low
    offload: blockswap     # fp8 原生加速，8G 实测 480x832x33帧≈108s（默认档）
  vid_wan_i2v_aio:
    role: [video]
    label: "WAN2.2 Rapid AIO（7.2G·快速一体包）"
    family: wan22
    weight: "wan2.2-i2v-rapid-aio-nsfw-v9.2.safetensors"
    vram_gb: 7.2
    tier: mid
    offload: blockswap
  vid_talk_infinitetalk:
    role: [video]
    family: wan22
    weight: "Wan2_1-InfiniteTalk-Single_fp8 + wav2vec2(chinese-base) 音频驱动口型"
    workflow: infinitetalk_talk.json
    vram_gb: 7.8
    tier: high
    offload: blockswap     # 8G 依赖 WanVideoBlockSwap 30 块 + 强制卸载，速度最慢质量最高
  vid_wan22_flf_q4:
    role: [video]
    label: "WAN2.2 首尾帧 Q4（9G·双帧/转场专用）"
    family: wan22
    weight: "Wan2.2-I2V-A14B-HighNoise-Q4_K_S.gguf + LowNoise-Q4_K_S.gguf + 4step LoRA"
    workflow: i2v_first_last.json
    vram_gb: 9.0
    tier: mid
    offload: blockswap     # 两块 GGUF 顺序加载，显存不足时落 RAM 换速度

scheduler:
  # 同一时刻仅允许一个重模型任务；以下类型可并行
  parallel_types: [tts, asr, stitch, export]
  vram_safety_margin_gb: 0.5

defaults:
  portrait_resolution: [832, 1216]   # 竖版定妆照
  video_resolution: [480, 832]       # 480p 先出，后期放大
  video_seconds: 5
